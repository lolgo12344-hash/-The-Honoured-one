name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

            - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project folder
        id: proj
        shell: bash
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            find . -maxdepth 3 -not -path "./.git/*" | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors in summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: |error:' build.log | head -30 || true
            sed -n '/What went wrong/,/Try:/p' build.log | head -25 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zara-debug-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
